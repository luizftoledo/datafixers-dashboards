name: Atualizar autos do Ibama no D1

on:
  schedule:
    - cron: "20 7 * * *" # 04:20 BRT / 07:20 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_URL: https://stibamadadosabertosprd.blob.core.windows.net/dados-abertos/dados/SIFISC/auto_infracao/auto_infracao/auto_infracao_csv.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Baixar e preparar o recorte anual oficial
        run: |
          curl --fail --location --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 1200 --output /tmp/auto_infracao.zip "$SOURCE_URL"
          python3 scripts/sync_ibama_d1.py /tmp/auto_infracao.zip --year "$(date -u +%Y)" --out-dir /tmp/ibama-sql
      - name: Aplicar lotes idempotentes no D1
        working-directory: worker
        run: |
          for file in /tmp/ibama-sql/*.sql; do
            npx wrangler d1 execute ibama --remote --file "$file"
          done
      - name: Registrar a atualização
        working-directory: worker
        run: |
          SHA=$(sha256sum /tmp/auto_infracao.zip | awk '{print $1}')
          BYTES=$(stat -c%s /tmp/auto_infracao.zip)
          TAKEN_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          npx wrangler d1 execute ibama --remote --command "INSERT INTO snapshots (dataset, taken_at, source_url, sha256, size_bytes, notes) VALUES ('auto_infracao', '$TAKEN_AT', '$SOURCE_URL', '$SHA', $BYTES, 'daily GitHub Actions upsert of current-year official CSV');"
