name: Update Emendas Dashboard Data

on:
  schedule:
    # 10:10 horario de Brasilia ~= 13:10 UTC
    - cron: "10 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Build emendas data
        run: |
          python scripts/build_emendas_dashboard_data.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- emendas/data; then
            echo "No emendas data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add emendas/data
          git commit -m "chore(data): update emendas-dashboard dataset"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Push failed after retries."
          exit 1

      - name: Check SIOP freshness
        if: always()
        run: |
          python - <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          with open('emendas/data/metadata.json', encoding='utf-8') as source:
              meta = json.load(source)
          date_text = meta.get('siop_base_siafi_date', '')
          try:
              base = datetime.strptime(date_text, '%d/%m/%Y').date()
              age = (datetime.now(timezone.utc).date() - base).days
          except ValueError:
              age = 999
          if not meta.get('siop_snapshot_available') or not 0 <= age <= 7:
              error = meta.get('siop_snapshot_error') or 'snapshot ausente ou antigo'
              print(f'::error title=SIOP desatualizado::Base {date_text or "sem data"}; {error}')
              sys.exit(1)
          print(f'SIOP atualizado: base {date_text} ({age} dia(s)).')
          PY
