name: Completar arquivo histórico do Ibama no D1

on:
  schedule:
    - cron: "0 2 * * 0,2-6" # exceto segunda-feira, quando roda a atualização semanal
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ibama-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_URL: https://stibamadadosabertosprd.blob.core.windows.net/dados-abertos/dados/SIFISC/auto_infracao/auto_infracao/auto_infracao_csv.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comparar IDs e preparar até 5 mil autos ausentes
        run: |
          curl --fail --location --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 1200 --output /tmp/auto_infracao.zip "$SOURCE_URL"
          python3 scripts/backfill_ibama_d1.py /tmp/auto_infracao.zip --out-dir /tmp/ibama-backfill
          cat /tmp/ibama-backfill/coverage.json >> "$GITHUB_STEP_SUMMARY"
      - name: Inserir lotes no D1
        working-directory: worker
        run: |
          for file in /tmp/ibama-backfill/batch-*.sql; do
            if [ -f "$file" ]; then
              npx wrangler d1 execute ibama --remote --file "$file"
            fi
          done
          npx wrangler d1 execute ibama --remote --file /tmp/ibama-backfill/coverage.sql
